[package]
name = "nx-sim"
description = "NxN cube simulator, orbits, parity and validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
# Rayon parallelism for heavy helpers (orbit computation, batch work). Off by default so the
# wasm build never sees it; native crates that want it enable it.
parallel = ["dep:rayon"]

[dependencies]
rand_chacha.workspace = true
rayon = { workspace = true, optional = true }

[dev-dependencies]
rg-cube.workspace = true
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "moves"
harness = false

[lints]
workspace = true
