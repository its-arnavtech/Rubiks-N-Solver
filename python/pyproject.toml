[project]
name = "nxnn"
version = "0.1.0"
description = "Neural orbit solver for NxN Rubik's cubes (training, evaluation, server)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.5",
    "numpy>=2.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "tensorboard>=2.17",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "maturin>=1.7,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nxnn"]

# CUDA build of PyTorch (docs/nn/SETUP.md §1). If the driver is too old, update the driver.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA device (deselect with -m 'not gpu')",
]
