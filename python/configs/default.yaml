# Full training run on the RTX 4060 laptop (ARCHITECTURE §8–9).
# Sized by measurement (M6.6 prep): ~4.8 steps/s, peak 1.3 GiB, so 100k steps ≈ 6 h.
# The first draft (batch 4096 × 8 actions, 6 layers) ran at 0.64 steps/s (~9 days).
run_name: default
seed: 0
device: cuda         # cpu | cuda
library: ../artifacts/macros/library.json

model:
  d_model: 256
  n_layers: 4
  n_heads: 8
  ffn_dim: 1024
  action_emb_dim: 256
  q_scale: 10.0

train:
  steps: 100000
  batch_size: 1024
  actions_per_state: 4
  lr: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000
  grad_clip: 1.0
  target_sync: 1000
  bf16: true
  type_weights: {Corner: 1, MidEdge: 1, Wing: 1, XCenter: 1, PlusCenter: 1, ObliqueA: 1, ObliqueB: 1}
  log_every: 100

curriculum:
  k_start: 2
  k_max: 30
  advance_solve_rate: 0.95
  k_uniform: 20
  p_uniform_after: 0.5
  check_every: 500
  check_states: 512

# In-training eval is kept light; run `just eval <ckpt>` for the full 4,096-state, beam-8 eval.
eval:
  every: 5000
  states_per_type: 1024
  step_cap: 64
  beam_width: 4

checkpoint:
  dir: ../artifacts/checkpoints
  every: 5000
  tensorboard_dir: ../runs
